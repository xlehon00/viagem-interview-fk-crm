services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fkcrm
      POSTGRES_USER: fkcrm
      POSTGRES_PASSWORD: fkcrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fkcrm -d fkcrm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
